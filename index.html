<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script defer src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    :root{
      --bg:#f4f6f9;
      --primary:#1e3a8a;
      --frontGreen:#2f7d57;
      --frontGreenDark:#1f5f42;
      --frontLine:#dce7e1;
      --card:#ffffff;
      --text:#1f2937;
      --muted:#6b7280;
      --line:#e5e7eb;
      --red:#ef4444;
      --green:#10b981;
      --shadow:0 14px 32px rgba(15,23,42,0.10);
    }
    *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html{ min-height:100%; background:var(--bg); }
    body{
      margin:0;
      background:
        radial-gradient(circle at 12% 0%,rgba(219,234,254,.86),rgba(219,234,254,0) 32%),
        linear-gradient(180deg,#fbfdff 0%,#f4f6f9 52%,#eef2f7 100%);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",Arial,sans-serif;
      padding-bottom:calc(76px + env(safe-area-inset-bottom));
      -webkit-font-smoothing:antialiased;
      overscroll-behavior-y:none;
    }
    .loading-overlay{
      position:fixed;
      inset:0;
      z-index:9999;
      display:flex;
      align-items:center;
      justify-content:center;
      background:rgba(255,255,255,.74);
      backdrop-filter:blur(6px);
    }
    .loading-overlay.hidden{ display:none; }
    .spinner{
      width:42px;
      height:42px;
      border-radius:50%;
      border:4px solid var(--line);
      border-top-color:var(--primary);
      animation:spin 1s linear infinite;
    }
    @keyframes spin{ to{ transform:rotate(360deg); } }
    .top-dashboard{
      padding:calc(18px + env(safe-area-inset-top)) 16px 18px;
      color:white;
      background:linear-gradient(135deg,#111827,#1e3a8a 54%,#3b82f6);
      border-radius:0 0 26px 26px;
      box-shadow:0 14px 34px rgba(30,58,138,.20);
    }
    .dash-header{ font-size:13px; font-weight:800; opacity:.9; }
    .dash-user{ margin-top:4px; font-size:22px; font-weight:950; letter-spacing:0; }
    .dash-stats{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin-top:16px; }
    .stat-item{
      min-height:74px;
      padding:12px;
      border:1px solid rgba(255,255,255,.18);
      border-radius:18px;
      background:rgba(255,255,255,.14);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.18);
    }
    .stat-label{ font-size:12px; font-weight:850; opacity:.82; }
    .stat-val{ margin-top:5px; font-size:21px; font-weight:950; }
    .main-canvas{ padding:14px; }
    .section-bar{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin:4px 0 12px; }
    .section-title{ font-size:20px; font-weight:950; color:#111827; }
    .month-actions{ display:flex; gap:7px; }
    .chip-btn{
      min-height:34px;
      padding:0 12px;
      border:1px solid #bfdbfe;
      border-radius:999px;
      background:#eff6ff;
      color:#1e3a8a;
      font-size:12px;
      font-weight:950;
      cursor:pointer;
      touch-action:manipulation;
    }
    .chip-btn:active{ transform:scale(.96); }
    .card{
      background:rgba(255,255,255,.94);
      border:1px solid rgba(220,231,225,.92);
      border-radius:24px;
      padding:12px;
      box-shadow:0 14px 34px rgba(23,35,29,.09);
    }
    .calendar-grid{ display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:7px; }
    .week-cell{
      text-align:center;
      color:#6b7b72;
      font-size:11px;
      font-weight:950;
      padding:5px 0 6px;
      border-radius:10px;
      background:rgba(248,252,250,.82);
    }
    .day-cell{
      min-height:116px;
      padding:7px 5px 6px;
      border:1px solid rgba(220,231,225,.88);
      border-radius:14px;
      background:linear-gradient(180deg,#ffffff,#fbfffd);
      text-align:center;
      box-shadow:0 5px 14px rgba(23,35,29,.045);
      cursor:pointer;
      touch-action:manipulation;
      transition:transform .1s ease, border-color .16s ease, background .16s ease, box-shadow .16s ease;
    }
    .day-cell.empty{ visibility:hidden; pointer-events:none; }
    .day-cell:active{ transform:scale(.97); }
    .day-num{ font-size:14px; font-weight:950; color:#17231d; line-height:1.1; }
    .day-meta{
      display:grid;
      grid-template-columns:1fr;
      gap:4px;
      width:100%;
      margin-top:7px;
      font-size:10px;
      font-weight:950;
      color:#6b7b72;
      line-height:1;
      white-space:nowrap;
    }
    .slot-pill{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:3px;
      min-height:23px;
      padding:0 5px;
      border-radius:9px;
      border:1px solid rgba(107,123,114,.16);
      background:#f8fafc;
      color:#64748b;
      box-shadow:0 3px 7px rgba(15,23,42,.04);
      cursor:pointer;
      touch-action:manipulation;
    }
    .slot-pill:active{ transform:scale(.97); }
    .slot-label{
      font-size:10px;
      font-weight:950;
      letter-spacing:0;
    }
    .slot-state{
      font-size:10px;
      font-weight:950;
      white-space:nowrap;
    }
    .slot-pill.open{
      border-color:rgba(47,125,87,.20);
      background:#ecfdf5;
      color:#1f5f42;
    }
    .slot-pill.booked{
      border-color:rgba(220,38,38,.24);
      background:#fee2e2;
      color:#991b1b;
    }
    .slot-pill.blocked{
      border-color:rgba(245,158,11,.30);
      background:#fef3c7;
      color:#92400e;
    }
    .day-cell.has-booking{
      border-color:rgba(47,125,87,.30);
      background:linear-gradient(180deg,#ecfdf5,#f7fff9);
      box-shadow:0 7px 16px rgba(47,125,87,.08);
    }
    .day-cell.has-booking .day-meta{ color:var(--frontGreenDark); }
    .day-cell.has-block{
      border-color:rgba(220,38,38,.22);
      background:linear-gradient(180deg,#fff7f7,#fef2f2);
    }
    .day-cell.has-block .day-meta{ color:#991b1b; }
    .day-cell.today{ outline:2px solid rgba(47,125,87,.16); border-color:rgba(47,125,87,.34); }
    .day-cell.selected{ transform:translateY(-1px); }
    @media(max-width:430px){
      .calendar-grid{ gap:5px; }
      .day-cell{
        min-height:104px;
        padding:6px 4px 5px;
        border-radius:12px;
      }
      .slot-pill{
        min-height:21px;
        padding:0 4px;
      }
      .slot-label,
      .slot-state{
        font-size:9px;
      }
    }
    /* Legacy admin calendar alignment */
    .appCalendarCard{
      padding:14px;
      border-color:rgba(125,211,252,0.52);
      background:linear-gradient(180deg,rgba(255,255,255,0.92),rgba(248,252,255,0.84));
      box-shadow:0 28px 62px rgba(8,145,178,0.16),0 6px 20px rgba(15,23,42,0.045);
      position:relative;
      overflow:hidden;
    }
    .appCalendarCard:before{
      content:"";
      position:absolute;
      inset:0 0 auto 0;
      height:4px;
      background:linear-gradient(90deg,#06b6d4,#2563eb,#14b8a6);
      box-shadow:0 0 18px rgba(6,182,212,0.40);
    }
    .appCalendarCard > *{ position:relative; }
    .appSectionHeader{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
      margin-bottom:12px;
    }
    .appSectionTitle{
      font-size:19px;
      font-weight:900;
      color:#0b1220;
      line-height:1.2;
      letter-spacing:0;
      text-shadow:0 1px 0 rgba(255,255,255,0.70);
    }
    .appSectionMeta{
      margin-top:3px;
      font-size:12px;
      font-weight:800;
      color:#475569;
    }
    .monthNavBtn{
      border:1px solid rgba(148,210,226,0.40);
      background:rgba(248,250,252,0.82);
      color:#0f172a;
      box-shadow:inset 0 1px 0 rgba(255,255,255,0.78);
    }
    .monthNavBtn.primary{
      background:linear-gradient(180deg,#06b6d4,#0891b2);
      color:white;
      border-color:#0891b2;
      box-shadow:0 8px 18px rgba(8,145,178,0.26),0 0 0 1px rgba(255,255,255,0.32) inset;
    }
    .calendarLegend{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:7px;
      margin:-3px 0 12px;
    }
    .legendItem{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:5px;
      min-height:28px;
      border-radius:999px;
      background:rgba(248,252,255,0.78);
      border:1px solid rgba(148,210,226,0.38);
      color:#334155;
      font-size:11px;
      font-weight:900;
    }
    .legendDot{
      width:8px;
      height:8px;
      border-radius:999px;
      background:#94a3b8;
      box-shadow:0 0 8px rgba(148,163,184,0.32);
    }
    .legendDot.free{ background:#16a34a; box-shadow:0 0 9px rgba(22,163,74,0.45); }
    .legendDot.booked{ background:#dc2626; box-shadow:0 0 9px rgba(220,38,38,0.40); }
    .legendDot.locked{ background:#64748b; box-shadow:0 0 9px rgba(100,116,139,0.38); }
    .legendDot.rest{ background:#f97316; box-shadow:0 0 9px rgba(249,115,22,0.38); }
    .legendDot.reserve{ background:#2563eb; box-shadow:0 0 9px rgba(37,99,235,0.34); }
    .legendDot.other{ background:#64748b; box-shadow:0 0 9px rgba(100,116,139,0.34); }
    .monthCalendar{ gap:6px; }
    .week-cell{
      font-size:12px;
      color:#475569;
      background:rgba(248,250,252,0.74);
      border-radius:999px;
      border:1px solid rgba(148,210,226,0.22);
    }
    .day-cell{
      min-height:112px;
      border:1px solid rgba(125,211,252,0.40);
      border-radius:16px;
      background:linear-gradient(180deg,rgba(255,255,255,0.94),rgba(248,252,255,0.84));
      box-shadow:0 4px 14px rgba(15,23,42,0.04),inset 0 1px 0 rgba(255,255,255,0.78),inset 0 0 0 1px rgba(255,255,255,0.34);
      overflow:hidden;
      position:relative;
    }
    .day-cell.today{
      border-color:#06b6d4;
      background:linear-gradient(180deg,#ecfeff 0%,#ffffff 72%);
      box-shadow:0 0 0 2px rgba(6,182,212,0.24),0 12px 30px rgba(8,145,178,0.18);
    }
    .day-cell.selected{
      outline:2px solid rgba(2,132,199,0.34);
      outline-offset:2px;
      border-color:#0f766e;
      background:linear-gradient(180deg,#f0fdfa,#ffffff);
      box-shadow:0 0 0 2px rgba(15,118,110,0.18),0 10px 24px rgba(15,118,110,0.12);
      color:#0f172a;
    }
    .day-cell.selected .day-num{ color:#0f172a; }
    .day-cell.selected .slot-pill.open{
      background:#dcfce7;
      color:#166534;
      border-color:#86efac;
    }
    .day-cell.selected .slot-pill.booked{
      background:#fee2e2;
      color:#991b1b;
      border-color:#fecaca;
    }
    .day-cell.selected .slot-pill.blocked{
      background:#e2e8f0;
      color:#475569;
      border-color:#cbd5e1;
    }
    .day-cell.allFree{
      border-color:#86efac;
      background:linear-gradient(180deg,#f0fdf4,#ffffff);
      box-shadow:inset 4px 0 0 #22c55e,0 7px 18px rgba(14,116,144,0.08);
    }
    .day-cell.fullBooked{
      border-color:#fecaca;
      background:linear-gradient(180deg,#fff1f2,#ffffff);
      box-shadow:inset 4px 0 0 #dc2626,0 7px 18px rgba(14,116,144,0.08);
    }
    .day-cell.fullLocked{
      border-color:#cbd5e1;
      background:linear-gradient(180deg,#f1f5f9,#ffffff);
      box-shadow:inset 4px 0 0 #64748b,0 7px 18px rgba(14,116,144,0.08);
    }
    .day-cell.block-rest{
      border-color:#fdba74;
      background:linear-gradient(180deg,#fff7ed,#ffffff);
      box-shadow:inset 4px 0 0 #f97316,0 7px 18px rgba(14,116,144,0.08);
    }
    .day-cell.block-reserve{
      border-color:#93c5fd;
      background:linear-gradient(180deg,#eff6ff,#ffffff);
      box-shadow:inset 4px 0 0 #2563eb,0 7px 18px rgba(14,116,144,0.08);
    }
    .day-cell.block-other{
      border-color:#cbd5e1;
      background:linear-gradient(180deg,#f8fafc,#ffffff);
      box-shadow:inset 4px 0 0 #64748b,0 7px 18px rgba(14,116,144,0.08);
    }
    .day-cell.partialBooked{
      border-color:#fed7aa;
      background:linear-gradient(180deg,#fff7ed,#ffffff);
      box-shadow:inset 4px 0 0 #f59e0b,0 7px 18px rgba(14,116,144,0.08);
    }
    .day-cell.partialLocked{
      border-color:#bae6fd;
      background:linear-gradient(180deg,#f8fafc,#ffffff);
      box-shadow:inset 4px 0 0 #0891b2,0 7px 18px rgba(14,116,144,0.08);
    }
    .day-cell.mixedStatus{
      border-color:#fde68a;
      background:linear-gradient(180deg,#fffbeb,#ffffff);
      box-shadow:inset 4px 0 0 #eab308,0 7px 18px rgba(14,116,144,0.08);
    }
    .slot-pill.open{
      background:#dcfce7;
      color:#166534;
      border-color:#86efac;
    }
    .slot-pill.booked{
      background:#fee2e2;
      color:#991b1b;
      border-color:#fecaca;
    }
    .slot-pill.blocked{
      background:#e2e8f0;
      color:#475569;
      border-color:#cbd5e1;
    }
    .slot-pill.blocked.block-rest{
      background:#ffedd5;
      color:#9a3412;
      border-color:#fdba74;
    }
    .slot-pill.blocked.block-reserve{
      background:#dbeafe;
      color:#1e40af;
      border-color:#93c5fd;
    }
    .slot-pill.blocked.block-other{
      background:#f1f5f9;
      color:#334155;
      border-color:#cbd5e1;
    }
    .selectedDayPanel{
      margin-top:14px;
      padding:14px;
      border-radius:20px;
      border:1px solid rgba(125,211,252,0.48);
      background:linear-gradient(180deg,rgba(255,255,255,0.94),rgba(241,250,255,0.86));
      box-shadow:0 14px 34px rgba(8,145,178,0.11);
      animation:selectedDayPanelIn .28s ease both;
      transform-origin:top center;
    }
    @keyframes selectedDayPanelIn{
      from{
        opacity:0;
        transform:translateY(10px) scale(.985);
      }
      to{
        opacity:1;
        transform:translateY(0) scale(1);
      }
    }
    .selectedDayHead{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:10px;
    }
    .selectedDayTitle{
      font-size:17px;
      font-weight:950;
      color:#0f172a;
      line-height:1.25;
    }
    .selectedDayHint{
      margin-top:3px;
      font-size:12px;
      font-weight:850;
      color:#64748b;
    }
    .selectedSlotList{
      display:grid;
      gap:9px;
    }
    .selectedSlotCard{
      min-height:56px;
      padding:10px 11px;
      border-radius:16px;
      border:1px solid rgba(203,213,225,0.76);
      background:rgba(255,255,255,0.82);
      box-shadow:0 8px 18px rgba(15,23,42,0.055);
      cursor:pointer;
      touch-action:manipulation;
      transition:transform .12s ease, box-shadow .16s ease, border-color .16s ease;
    }
    .selectedSlotCard:active{ transform:scale(0.98); }
    .selectedSlotCard.open{
      border-color:rgba(22,163,74,0.34);
      background:linear-gradient(180deg,#ecfdf5,#f7fff9);
    }
    .selectedSlotCard.booked{
      border-color:rgba(220,38,38,0.28);
      background:linear-gradient(180deg,#fff7f7,#fef2f2);
    }
    .selectedSlotCard.blocked{
      border-color:rgba(100,116,139,0.34);
      background:linear-gradient(180deg,#f8fafc,#eef2f7);
    }
    .selectedSlotCard.blocked.block-rest{
      border-color:rgba(249,115,22,0.36);
      background:linear-gradient(180deg,#fff7ed,#ffedd5);
    }
    .selectedSlotCard.blocked.block-reserve{
      border-color:rgba(37,99,235,0.30);
      background:linear-gradient(180deg,#eff6ff,#dbeafe);
    }
    .selectedSlotCard.blocked.block-other{
      border-color:rgba(100,116,139,0.34);
      background:linear-gradient(180deg,#f8fafc,#eef2f7);
    }
    .selectedSlotRow{
      display:grid;
      grid-template-columns:auto 1fr auto;
      align-items:center;
      gap:10px;
    }
    .selectedSlotPeriod{
      width:48px;
      height:36px;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:12px;
      background:rgba(8,145,178,0.10);
      color:#0e7490;
      font-size:13px;
      font-weight:950;
    }
    .selectedSlotMain{
      min-width:0;
    }
    .selectedSlotStatus{
      font-size:14px;
      font-weight:950;
      color:#0f172a;
      line-height:1.2;
    }
    .selectedSlotSub{
      margin-top:3px;
      font-size:12px;
      font-weight:800;
      color:#64748b;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .selectedSlotAction{
      min-width:70px;
      padding:7px 9px;
      border-radius:999px;
      text-align:center;
      font-size:12px;
      font-weight:950;
      color:white;
      background:linear-gradient(180deg,#38bdf8,#2563eb);
      box-shadow:0 6px 14px rgba(37,99,235,0.16);
    }
    .selectedSlotCard.booked .selectedSlotAction{
      background:linear-gradient(180deg,#fb7185,#dc2626);
      box-shadow:0 6px 14px rgba(220,38,38,0.14);
    }
    .selectedSlotCard.blocked .selectedSlotAction{
      background:linear-gradient(180deg,#94a3b8,#64748b);
      box-shadow:0 6px 14px rgba(100,116,139,0.14);
    }
    .selectedSlotCard.block-rest .selectedSlotAction{
      background:linear-gradient(180deg,#fb923c,#ea580c);
      box-shadow:0 6px 14px rgba(249,115,22,0.16);
    }
    .selectedSlotCard.block-reserve .selectedSlotAction{
      background:linear-gradient(180deg,#60a5fa,#2563eb);
      box-shadow:0 6px 14px rgba(37,99,235,0.16);
    }
    .selectedBookingList{
      display:grid;
      gap:8px;
      margin-top:10px;
      padding-top:10px;
      border-top:1px solid rgba(203,213,225,0.74);
    }
    .selectedBookingItem{
      border-radius:14px;
      border:1px solid rgba(203,213,225,0.70);
      background:rgba(255,255,255,0.72);
      padding:9px;
      box-shadow:0 5px 12px rgba(15,23,42,0.045);
    }
    .selectedBookingName{
      font-size:15px;
      font-weight:950;
      color:#0f172a;
      line-height:1.25;
    }
    .selectedBookingDetail{
      margin-top:5px;
      font-size:12px;
      font-weight:800;
      color:#475569;
      line-height:1.5;
      white-space:pre-wrap;
    }
    .selectedBookingActions{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(72px,1fr));
      gap:7px;
      margin-top:8px;
    }
    .payment-card{
      display:grid;
      gap:12px;
      text-align:left;
    }
    .payment-card-head{
      padding:12px;
      border-radius:16px;
      background:linear-gradient(180deg,#fffbeb,#fef3c7);
      border:1px solid #fde68a;
      color:#713f12;
      font-weight:900;
      line-height:1.55;
    }
    .payment-amount{
      margin-top:4px;
      color:#92400e;
      font-size:24px;
      font-weight:950;
    }
    .payment-lines{
      padding:12px;
      border-radius:16px;
      background:#f8fafc;
      border:1px solid #e2e8f0;
      color:#334155;
      font-size:13px;
      font-weight:800;
      line-height:1.7;
      white-space:pre-wrap;
      user-select:text;
      -webkit-user-select:text;
    }
    .list{ display:grid; gap:10px; }
    .work-card{
      background:#fff;
      border:1px solid var(--line);
      border-radius:18px;
      padding:13px;
      box-shadow:0 8px 20px rgba(15,23,42,.06);
    }
    .work-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
    .work-time{
      display:inline-flex;
      padding:4px 9px;
      border-radius:999px;
      background:#eff6ff;
      color:#1e3a8a;
      font-size:12px;
      font-weight:950;
      white-space:nowrap;
    }
    .work-name{ margin-top:7px; font-size:17px; font-weight:950; color:#111827; }
    .work-detail{ margin-top:7px; color:#4b5563; font-size:13px; font-weight:750; line-height:1.48; white-space:pre-wrap; }
    .work-actions{ display:grid; grid-template-columns:repeat(auto-fit,minmax(86px,1fr)); gap:8px; margin-top:10px; }
    .payment-badge{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:24px;
      padding:3px 8px;
      border-radius:999px;
      border:1px solid rgba(148,163,184,.35);
      background:#f8fafc;
      color:#475569;

      var requestSeq = ++adminDataRequestSeq;

          adminDataPrefetching[cacheKey] = false;
        })

    }

    function upsertCachedEventLocally(item){
      if(!item || !item.eventId || !cachedData){
        return;
      }
      if(!item.dateText && item.date){
        item.dateText = item.date;
      }
      if(!cachedData.events){
        cachedData.events = [];
      }
      var found = false;
      var oldDateText = "";
      for(var i=0;i<cachedData.events.length;i++){
        if(cachedData.events[i].eventId === item.eventId){
          oldDateText =
            cachedData.events[i].dateText ||
            cachedData.events[i].date ||
            "";
          cachedData.events[i] = item;
          found = true;
          break;
        }
      }
      if(!found){
        cachedData.events.push(item);
      }
      if(oldDateText && oldDateText !== item.dateText){
        rebuildDaySummaryFromCachedEvents(oldDateText);
      }
      if(item.dateText){
        rebuildDaySummaryFromCachedEvents(item.dateText);
      }
      selectedDateText = item.dateText || selectedDateText;
      refreshCurrentTab();
    }

    function applySlotStateLocally(dateText,slotKey,slotStatus,reason){
      if(!cachedData){
        return;
      }
      if(!cachedData.daySummary){
        cachedData.daySummary = {};
      }
      if(!cachedData.daySummary[dateText]){
        cachedData.daySummary[dateText] = {
          dateText:dateText,
          bookingCount:0,
          blockCount:0,
          revenue:0,
          slots:{ morning:"open", afternoon:"open", evening:"open" },
          slotReasons:{ morning:"", afternoon:"", evening:"" }
        };
      }
      var summary = cachedData.daySummary[dateText];
      if(!summary.slots){ summary.slots = {}; }
      if(!summary.slotReasons){ summary.slotReasons = {}; }

      var oldStatus = summary.slots[slotKey] || "open";
      if(oldStatus === "blocked" && slotStatus !== "blocked"){
        summary.blockCount = Math.max(0, Number(summary.blockCount || 0) - 1);
      }
      if(oldStatus !== "blocked" && slotStatus === "blocked"){
        summary.blockCount = Number(summary.blockCount || 0) + 1;
      }

      summary.slots[slotKey] = slotStatus || "open";
      summary.slotReasons[slotKey] =
        slotStatus === "blocked" ?
        normalizeBlockReasonKey(reason) :
        "";
      selectedDateText = dateText;
      expandedSlotKey = "";
      refreshCurrentTab();
    }

    function normalizeBlockReasonKey(reason){
      var text = String(reason || "");
      if(text === "rest" || text.indexOf("\u4f11") >= 0){ return "rest"; }
      if(text === "reserve" || text.indexOf("\u4fdd\u7559") >= 0 || text.indexOf("\u9810\u7559") >= 0){ return "reserve"; }
      if(text === "other" || text){ return "other"; }
      return "";
    }

    function getMonthOffsetFromDateText(dateText){
      var parts = String(dateText || "").split("-");
      if(parts.length < 2){ return currentMonthOffset; }
      var targetYear = Number(parts[0] || 0);
      var targetMonth = Number(parts[1] || 0);
      if(!targetYear || !targetMonth){ return currentMonthOffset; }
      var now = new Date();
      return (targetYear - now.getFullYear()) * 12 + (targetMonth - (now.getMonth() + 1));
    }

    function renderCalendarTab(){
      var start = getMonthStart(currentMonthOffset);
      var year = start.getFullYear();
      var month = start.getMonth();
      var firstDay = new Date(year, month, 1).getDay();
      var days = new Date(year, month + 1, 0).getDate();
      var today = cachedData.todayText;
      var html = "";

      html += '<div class="calendarBox adminCalendarBox">';
      html += '<div class="calendarCard">';
      html += '<div class="monthHeader">';
      html += '<div class="monthTitle">' + year + ' / ' + (month + 1) + '</div>';
      html += '<div class="monthNav">';
      html += '<button class="monthNavBtn" type="button" onclick="loadData(currentMonthOffset - 1)">\u4e0a\u6708</button>';
      html += '<button class="monthNavBtn primary" type="button" onclick="loadData(0)">\u672c\u6708</button>';
      html += '<button class="monthNavBtn" type="button" onclick="loadData(currentMonthOffset + 1)">\u4e0b\u6708</button>';
      html += '</div></div>';
      html += '<div class="calendarLegend">';
      html += '<div class="legendItem"><span class="legendDot free"></span>\u53ef\u9810\u7d04</div>';
      html += '<div class="legendItem"><span class="legendDot booked"></span>\u5df2\u6eff</div>';
      html += '<div class="legendItem"><span class="legendDot closed"></span>\u672a\u958b\u653e</div>';
      html += '</div>';
      html += '<div class="adminCalendarQuickActions">';
      html += '<button class="adminCalendarQuickBtn" type="button" onclick="lockCurrentMonthEveningSlots()">\u4e00\u9375\u95dc\u9589\u672c\u6708\u665a\u4e0a\u6642\u6bb5</button>';
      html += '</div>';
      html += '<div class="monthCalendar">';
      ["\u65e5","\u4e00","\u4e8c","\u4e09","\u56db","\u4e94","\u516d"].forEach(function(w){
        html += '<div class="weekCell">' + w + '</div>';
      });
      var prevMonthDays = new Date(year, month, 0).getDate();
      for(var i=0;i<firstDay;i++){
        html += buildOtherMonthCalendarDay(prevMonthDays - firstDay + i + 1);
      }
      for(var d=1;d<=days;d++){
        var dateText = formatDateText(year, month + 1, d);
        var summary = cachedData.daySummary[dateText] || {};
        var cls = "calendarDay";
        cls += " " + buildAdminOriginalCalendarDayClass(summary);
        if(dateText === today){ cls += " today"; }
        if(dateText === selectedDateText){ cls += " selected"; }
        html += "<div class='" + cls + "' data-date='" + escapeAttr(dateText) + "' onclick=\"selectAdminCalendarDate('" + escapeJs(dateText) + "')\">";
        html += '<div class="calendarDate">' + d + '</div>';
        html += '<div class="calendarSlots">' + buildAdminOriginalCalendarSlots(dateText, summary) + '</div>';
        html += buildAdminOriginalStatusBadge(summary);
        html += buildAdminOriginalSummary(summary);
        html += '</div>';
      }
      var usedCells = firstDay + days;
      var tailCells = usedCells % 7 === 0 ? 0 : 7 - (usedCells % 7);
      for(var nextDay=1;nextDay<=tailCells;nextDay++){
        html += buildOtherMonthCalendarDay(nextDay);
      }
      html += '</div>';
      html += '</div>';
      html += '</div>';
      html += '<div id="selectedDayPanelHost">';
      html += renderSelectedDateSlotPanel();
      html += '</div>';
      document.getElementById("mainCanvas").innerHTML = html;
    }

    function buildOtherMonthCalendarDay(dayNumber){
      return '<div class="calendarDay otherMonth">' +
        '<div class="calendarDate">' + Number(dayNumber || 0) + '</div>' +
        '<div class="calendarSlots">' +
        '<span class="calendarMiniSlot closed">早</span>' +
        '<span class="calendarMiniSlot closed">午</span>' +
        '<span class="calendarMiniSlot closed">晚</span>' +
        '</div>' +
        '<div class="dayStatusBadge closed">\u975e\u672c\u6708</div>' +
        '<div class="calendarSummary">&nbsp;</div>' +
        '</div>';
    }

    function renderWorklistTab(){

        worklistMode === "tomorrow" ?

        cachedData.todayText;

        worklistMode === "tomorrow" ?
        "\u660e\u65e5\u5de5\u55ae" :

      html += '<div class="appSectionMeta" style="line-height:1.55;">\u627e\u51fa\u672c\u6708\u91d1\u984d\u7a7a\u767d\u6216 0 \u5143\u7684\u9810\u7d04\uff0c\u9ede\u64ca\u4fee\u6539\u5373\u53ef\u88dc\u91d1\u984d\u8207\u6536\u6b3e\u72c0\u614b\u3002</div>';
      html += '<div class="month-actions" style="margin-top:10px;">';

        html += '<div class="card empty">\u672c\u6708\u9810\u7d04\u90fd\u5df2\u586b\u5beb\u91d1\u984d</div>';

    function getMissingAmountItems(sourceData){
      if(!sourceData || !sourceData.events){
        return [];
      }
      return sourceData.events.filter(function(item){
        return item.isBooking && Number(item.amount || 0) <= 0;
      });
    }

    function updateMissingAmountHint(sourceData){
      var hint = document.getElementById("missingAmountHint");
      if(!hint){
        return;
      }
      if(!sourceData || !sourceData.events){
        hint.className = "stat-note";
        hint.textContent = "\u5c1a\u672a\u8f09\u5165";
        return;
      }
      var count = getMissingAmountItems(sourceData).length;
      if(count > 0){
        hint.className = "stat-note warn";
        hint.textContent = "\u672a\u586b " + count + " \u7b46";
      }else{
        hint.className = "stat-note ok";
        hint.textContent = "\u91d1\u984d\u5df2\u5b8c\u6574";
      }
    }

    function buildMissingAmountCard(item){
      var eventArg = encodeEventArg(item.eventId);
      var snapshotArg = encodeEventArg(JSON.stringify(buildEventSnapshot(item)));
      var mapUrl = item.address ?
        'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(item.address) :
        '';
      var html = "<div class='work-card' onclick=\"openEditBookingFromSnapshotByArg('" + snapshotArg + "')\">";
      html += '<div class="work-top"><div class="work-time">' + escapeHtml((item.dateText || "") + " " + item.period + " " + item.time) + '</div><span class="payment-badge unpaid">\u672a\u586b\u91d1\u984d</span></div>';
      html += '<div class="work-name">' + escapeHtml(item.name || item.title || "\u672a\u547d\u540d") + '</div>';
      html += '<div class="work-detail">';
      if(item.phone){ html += '\u96fb\u8a71\uff1a' + escapeHtml(item.phone) + "\n"; }
      if(item.address){ html += '\u5730\u5740\uff1a' + escapeHtml(item.address) + "\n"; }
      if(item.service){ html += '\u670d\u52d9\uff1a' + escapeHtml(item.service); }
      html += '</div>';
      html += '<div class="work-actions">';
      html += "<button class=\"action-btn primary\" type=\"button\" onclick=\"event.stopPropagation();openEditBookingFromSnapshotByArg('" + snapshotArg + "')\">\u88dc\u91d1\u984d</button>";
      html += item.phone ? '<a class="action-link call-link" href="tel:' + escapeAttr(item.phone) + '" onclick="event.stopPropagation()">\u64a5\u96fb\u8a71</a>' : '<span class="action-link">\u7121\u96fb\u8a71</span>';
      html += mapUrl ? '<a class="action-link map-link" href="' + escapeAttr(mapUrl) + '" target="_blank" onclick="event.stopPropagation()">\u958b\u5730\u5716</a>' : '<span class="action-link">\u7121\u5730\u5740</span>';
      html += '</div></div>';

    function buildEventSnapshot(item){
      item = item || {};
      return {
        eventId:item.eventId || "",
        dateText:item.dateText || "",
        period:item.period || "",
        time:item.time || "",
        startMillis:item.startMillis || 0,
        endMillis:item.endMillis || 0,
        title:item.title || "",
        name:item.name || "",
        phone:item.phone || ""
      };
    }

    function renderLogsTab(){
      document.getElementById("mainCanvas").innerHTML =
        '<div class="section-bar"><div class="section-title">\u4fee\u6539\u7d00\u9304</div></div>' +
        '<div class="card" style="padding:12px;margin-bottom:12px;">' +
        '<div class="month-actions" style="margin:0;">' +
        '<button class="chip-btn ' + (changeLogDays === 1 ? 'primary' : '') + '" onclick="loadChangeLogs(1)">\u4eca\u5929</button>' +
        '<button class="chip-btn ' + (changeLogDays === 2 ? 'primary' : '') + '" onclick="loadChangeLogs(2)">\u5169\u5929</button>' +
        '<button class="chip-btn ' + (changeLogDays === 7 ? 'primary' : '') + '" onclick="loadChangeLogs(7)">7 \u5929</button>' +
        '</div>' +
        '<div class="appSectionMeta" style="margin-top:8px;">\u8b80\u53d6\u6700\u8fd1 ' + changeLogDays + ' \u5929\u7684\u5f8c\u53f0\u64cd\u4f5c</div>' +
        '</div>' +
        '<div class="card empty">\u4fee\u6539\u7d00\u9304\u8f09\u5165\u4e2d...</div>';
      loadChangeLogs(changeLogDays, true);

    function loadChangeLogs(days, keepHeader){
      changeLogDays = Number(days || 2);
      if(!keepHeader){
        renderLogsTab();
        return;
      }

      google.script.run
        .withSuccessHandler(function(result){
          renderChangeLogList(result || { status:"ERROR", logs:[] });
        })
        .withFailureHandler(function(err){
          document.getElementById("mainCanvas").innerHTML =
            '<div class="section-bar"><div class="section-title">\u4fee\u6539\u7d00\u9304</div></div>' +
            '<div class="card empty">\u4fee\u6539\u7d00\u9304\u8f09\u5165\u5931\u6557\uff1a' +
            escapeHtml(err && err.message ? err.message : "\u8acb\u7a0d\u5f8c\u518d\u8a66") +
            '</div>';
        })
        .getAdminAppChangeLogs(changeLogDays);
    }

    function renderChangeLogList(result){
      var html =
        '<div class="section-bar"><div class="section-title">\u4fee\u6539\u7d00\u9304</div></div>' +
        '<div class="card" style="padding:12px;margin-bottom:12px;">' +
        '<div class="month-actions" style="margin:0;">' +
        '<button class="chip-btn ' + (changeLogDays === 1 ? 'primary' : '') + '" onclick="loadChangeLogs(1)">\u4eca\u5929</button>' +
        '<button class="chip-btn ' + (changeLogDays === 2 ? 'primary' : '') + '" onclick="loadChangeLogs(2)">\u5169\u5929</button>' +
        '<button class="chip-btn ' + (changeLogDays === 7 ? 'primary' : '') + '" onclick="loadChangeLogs(7)">7 \u5929</button>' +
        '</div>';

      if(result.status !== "OK"){
        html += '<div class="appSectionMeta" style="margin-top:8px;color:#dc2626;">' + escapeHtml(result.message || "\u8b80\u53d6\u5931\u6557") + '</div></div>';
        html += '<div class="card empty">\u76ee\u524d\u7121\u6cd5\u8b80\u53d6\u4fee\u6539\u7d00\u9304</div>';
        document.getElementById("mainCanvas").innerHTML = html;
        return;
      }

      html += '<div class="appSectionMeta" style="margin-top:8px;">\u6700\u8fd1 ' + changeLogDays + ' \u5929\uff0c\u5171 ' + (result.logs || []).length + ' \u7b46</div></div>';

      if(!result.logs || !result.logs.length){
        html += '<div class="card empty">\u9019\u6bb5\u6642\u9593\u9084\u6c92\u6709\u4fee\u6539\u7d00\u9304</div>';
        document.getElementById("mainCanvas").innerHTML = html;
        return;
      }

      html += '<div class="list">';
      result.logs.forEach(function(item){
        html += buildChangeLogCard(item);
      });
      html += '</div>';
      document.getElementById("mainCanvas").innerHTML = html;
    }

    function buildChangeLogCard(item){
      var eventArg = encodeEventArg(item.eventId || "");
      var logText = buildChangeLogText(item);
      var html = '<div class="work-card">';
      html += '<div class="work-top"><div class="work-time">' + escapeHtml(item.time || "") + '</div></div>';
      html += '<div class="work-name">' + escapeHtml(item.action || "\u5f8c\u53f0\u64cd\u4f5c") + '</div>';
      html += '<div class="work-detail">';
      if(item.name || item.title){ html += '\u5ba2\u4eba\uff1a' + escapeHtml(item.name || item.title) + "\n"; }
      if(item.date || item.bookingTime){ html += '\u6642\u9593\uff1a' + escapeHtml((item.date || "") + " " + (item.bookingTime || "")) + "\n"; }
      if(item.phone){ html += '\u96fb\u8a71\uff1a' + escapeHtml(item.phone) + "\n"; }
      if(item.address){ html += '\u5730\u5740\uff1a' + escapeHtml(item.address) + "\n"; }
      if(item.detail){ html += '\u8aaa\u660e\uff1a' + escapeHtml(item.detail); }
      html += '</div>';
      html += '<div class="work-actions">';
      if(item.eventId){
        html += "<button class=\"action-btn primary\" type=\"button\" onclick=\"openEditBookingFormByArg('" + eventArg + "')\">\u67e5\u770b/\u4fee\u6539</button>";
      }
      html += "<button class=\"action-btn reminder\" type=\"button\" onclick=\"copyTextToClipboard('" + escapeJs(logText) + "','\u5df2\u8907\u88fd\u7d00\u9304')\">\u8907\u88fd\u7d00\u9304</button>";
      html += '</div></div>';
      return html;
    }

    function buildChangeLogText(item){
      var lines = [];
      lines.push("\u64cd\u4f5c\uff1a" + (item.action || "\u5f8c\u53f0\u64cd\u4f5c"));
      if(item.time){ lines.push("\u6642\u9593\uff1a" + item.time); }
      if(item.name || item.title){ lines.push("\u5ba2\u4eba\uff1a" + (item.name || item.title)); }
      if(item.date || item.bookingTime){ lines.push("\u9810\u7d04\uff1a" + ((item.date || "") + " " + (item.bookingTime || "")).trim()); }
      if(item.phone){ lines.push("\u96fb\u8a71\uff1a" + item.phone); }
      if(item.address){ lines.push("\u5730\u5740\uff1a" + item.address); }
      if(item.detail){ lines.push("\u8aaa\u660e\uff1a" + item.detail); }
      return lines.join("\n");
    }

    function renderLogsTabOld(){
      document.getElementById("mainCanvas").innerHTML =
        '<div class="section-bar"><div class="section-title">\u4fee\u6539\u7d00\u9304</div></div>' +
        '<div class="card empty">\u9019\u662f\u65b0\u5f8c\u53f0\u9810\u89bd\u9801\uff0c\u4fee\u6539\u7d00\u9304\u4e4b\u5f8c\u6703\u63a5\u539f\u672c\u7684\u7d00\u9304 API\u3002</div>';
    }

    function renderEventList(title, items, targetDate){
      var html = '<div class="section-bar"><div class="section-title">' + escapeHtml(title) + '</div></div>';
      html += '<div class="card" style="padding:12px;margin-bottom:12px;">';
      html += '<div class="month-actions" style="margin:0;">';
      html += '<button class="chip-btn ' + (worklistMode === "today" ? 'primary' : '') + '" onclick="setWorklistMode(\'today\')">\u4eca\u65e5</button>';
      html += '<button class="chip-btn ' + (worklistMode === "tomorrow" ? 'primary' : '') + '" onclick="setWorklistMode(\'tomorrow\')">\u660e\u65e5</button>';
      html += '</div>';
      html += '<div class="appSectionMeta" style="margin-top:8px;">' + escapeHtml(targetDate || "") + ' \u5171 ' + items.length + ' \u7b46\u9810\u7d04</div>';
      html += '</div>';
      if(!items.length){
        html += '<div class="card empty">\u76ee\u524d\u6c92\u6709\u5de5\u55ae</div>';
        document.getElementById("mainCanvas").innerHTML = html;
        return;
      }
      html += buildRouteAction(items);
      html += '<div class="list">';
      items.forEach(function(item,index){
        html += buildWorkCard(item,index + 1);
      });
      html += '</div>';
      document.getElementById("mainCanvas").innerHTML = html;

    function isPaidStatus(status){
      status = String(status || "");
      return status.indexOf("\u5df2\u6536\u5168\u984d") >= 0 ||
        status.indexOf("\u5df2\u6536") >= 0 ||
        status.indexOf("\u73fe\u5834\u4ed8\u6b3e") >= 0;
    }

    function getPaymentBadgeClass(status){
      status = String(status || "");
      if(isPaidStatus(status)){ return "paid"; }
      if(status.indexOf("\u8a02\u91d1") >= 0){ return "deposit"; }
      return "unpaid";
    }

    function buildPaymentBadge(status){
      status = String(status || "\u672a\u6536\u6b3e");
      return '<span class="payment-badge ' + getPaymentBadgeClass(status) + '">' + escapeHtml(status) + '</span>';
    }

    function setWorklistMode(mode){
      worklistMode = mode === "tomorrow" ? "tomorrow" : "today";
      renderWorklistTab();
    }

    function buildRouteAction(items){
      var addresses = items
        .map(function(item){ return String(item.address || "").trim(); })
        .filter(function(address){ return !!address; });

      if(!addresses.length){
        return "";
      }

      var url = "";
      if(addresses.length === 1){
        url = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(addresses[0]);
      }else{
        url = "https://www.google.com/maps/dir/?api=1&origin=" +
          encodeURIComponent(addresses[0]) +
          "&destination=" +
          encodeURIComponent(addresses[addresses.length - 1]);
        if(addresses.length > 2){
          url += "&waypoints=" + addresses.slice(1,-1).map(encodeURIComponent).join("|");
        }
      }

      return '<a class="card action-link" style="display:block;text-align:center;margin-bottom:12px;background:linear-gradient(180deg,#e0f2fe,#bae6fd);color:#075985;border-color:#7dd3fc;font-size:15px;" target="_blank" href="' + escapeAttr(url) + '">\u958b\u555f\u9806\u8def\u5c0e\u822a</a>';
    }

    function buildWorkCard(item,routeOrder){
      var mapUrl = item.address ?
        'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(item.address) :
        '';
      var eventArg = encodeEventArg(item.eventId);
      var html = "<div class='work-card' onclick=\"openEventDrawerByArg('" + eventArg + "')\">";
      html += '<div class="work-top"><div class="work-time">' + escapeHtml((item.dateText || "") + " " + item.period + " " + item.time) + '</div>';
      if(routeOrder){
        html += '<span class="route-step">\u7b2c ' + Number(routeOrder || 0) + ' \u7ad9</span>';
      }
      html += buildPaymentBadge(item.paymentStatus) + '</div>';
      html += '<div class="work-name">' + escapeHtml(item.name || item.title || "\u672a\u547d\u540d") + '</div>';
      html += '<div class="work-detail">';
      if(item.phone){ html += '\u96fb\u8a71\uff1a' + escapeHtml(item.phone) + "\n"; }
      if(item.address){ html += '\u5730\u5740\uff1a' + escapeHtml(item.address) + "\n"; }
      if(item.service){ html += '\u670d\u52d9\uff1a' + escapeHtml(item.service) + "\n"; }
      if(item.amount){ html += '\u91d1\u984d\uff1a$' + Number(item.amount || 0).toLocaleString() + "\n"; }
      if(item.note){ html += '\u5099\u8a3b\uff1a' + escapeHtml(item.note); }
      html += '</div>';
      html += '<div class="work-actions">';
      if(item.isBooking){
        html += "<button class=\"action-btn primary\" type=\"button\" onclick=\"event.stopPropagation();openEditBookingFormByArg('" + eventArg + "')\">\u4fee\u6539\u8a02\u55ae</button>";
        html += "<button class=\"action-btn danger\" type=\"button\" onclick=\"event.stopPropagation();confirmAppDeleteBookingByArg('" + eventArg + "')\">\u522a\u9664\u9810\u7d04</button>";
        html += "<button class=\"action-btn reminder\" type=\"button\" onclick=\"event.stopPropagation();copyReminderTextByArg('" + eventArg + "')\">\u63d0\u9192\u6587</button>";
        html += "<button class=\"action-btn payment\" type=\"button\" onclick=\"event.stopPropagation();openPaymentInfoByArg('" + eventArg + "')\">\u4ed8\u6b3e\u8cc7\u8a0a</button>";
        if(isRecurringBookingItem(item)){
          html += "<button class=\"action-btn recurringGroup\" type=\"button\" onclick=\"event.stopPropagation();openRecurringGroupByArg('" + eventArg + "')\">\u5f8c\u7e8c\u9810\u7d04</button>";
        }
      }
      html += item.phone ? '<a class="action-link call-link" href="tel:' + escapeAttr(item.phone) + '" onclick="event.stopPropagation()">\u64a5\u96fb\u8a71</a>' : '<span class="action-link">\u7121\u96fb\u8a71</span>';
      html += mapUrl ? '<a class="action-link map-link" href="' + escapeAttr(mapUrl) + '" target="_blank" onclick="event.stopPropagation()">\u958b\u5730\u5716</a>' : '<span class="action-link">\u7121\u5730\u5740</span>';
      html += '</div></div>';
      return html;
    }

    function openDayDetail(dateText){
      selectedDateText = dateText;
      expandedSlotKey = "";
      renderCalendarTab();
      var items = cachedData.events.filter(function(item){
        return item.dateText === dateText;
      });
      if(!items.length){
        openDrawer(dateText, '<div class="empty">\u9019\u5929\u6c92\u6709\u884c\u7a0b</div>');
        return;
      }
      var html = '<div class="list">';
      items.forEach(function(item){ html += buildWorkCard(item); });
      html += '</div>';
      openDrawer(dateText, html);
    }

    function selectAdminCalendarDate(dateText){
      var oldDateText = selectedDateText;
      if(selectedDateText !== dateText){
        expandedSlotKey = "";
      }
      selectedDateText = dateText;
      updateCalendarSelectedDateUi(oldDateText,dateText);
      renderSelectedDateSlotPanelIntoHost();
      var panel = document.getElementById("selectedDayPanel");
      if(panel){
        setTimeout(function(){
          panel.scrollIntoView({ behavior:"smooth", block:"nearest" });
        }, 80);
      }
    }

    function updateCalendarSelectedDateUi(oldDateText,newDateText){
      if(oldDateText){
        var oldEl = findCalendarDayElement(oldDateText);
        if(oldEl){ oldEl.classList.remove("selected"); }
      }
      if(newDateText){
        var newEl = findCalendarDayElement(newDateText);
        if(newEl){ newEl.classList.add("selected"); }
      }
    }

    function findCalendarDayElement(dateText){
      var days = document.querySelectorAll(".calendarDay[data-date]");
      for(var i=0;i<days.length;i++){
        if(days[i].getAttribute("data-date") === dateText){
          return days[i];
        }
      }
      return null;
    }

    function renderSelectedDateSlotPanelIntoHost(){
      var host = document.getElementById("selectedDayPanelHost");
      if(host){
        host.innerHTML = renderSelectedDateSlotPanel();
      }
    }

    function openEventDrawer(eventId){
      var item = findCachedEvent(eventId);
      if(!item){ return; }
      var eventArg = encodeEventArg(eventId);
      var html = '<div class="work-detail">';
      html += '\u6642\u9593\uff1a' + escapeHtml(item.dateText + " " + formatBookingPeriodTime(item)) + "\n";
      html += '\u59d3\u540d\uff1a' + escapeHtml(item.name || "") + "\n";
      html += '\u96fb\u8a71\uff1a' + escapeHtml(item.phone || "") + "\n";
      html += '\u5730\u5740\uff1a' + escapeHtml(item.address || "") + "\n";
      html += '\u670d\u52d9\uff1a' + escapeHtml(item.service || "") + "\n";
      html += '\u91d1\u984d\uff1a' + escapeHtml(formatAmountText(item.amount)) + "\n";
      html += '\u5099\u8a3b\uff1a' + escapeHtml(item.note || "");
      html += '</div>';
      html += '<div class="work-actions">';
      if(item.isBooking){
        html += "<button class=\"action-btn primary\" type=\"button\" onclick=\"event.stopPropagation();openEditBookingFormByArg('" + eventArg + "')\">\u4fee\u6539\u8a02\u55ae</button>";
        html += "<button class=\"action-btn danger\" type=\"button\" onclick=\"event.stopPropagation();confirmAppDeleteBookingByArg('" + eventArg + "')\">\u522a\u9664\u9810\u7d04</button>";

    function rebuildDaySummaryFromCachedEvents(dateText){
      var summary = {
        dateText:dateText,
        bookingCount:0,
        blockCount:0,
        revenue:0,
        slots:{ morning:"open", afternoon:"open", evening:"open" },
        slotReasons:{ morning:"", afternoon:"", evening:"" }
      };
      (cachedData.events || []).forEach(function(item){
        if(item.dateText !== dateText){ return; }
        var slotKey = getSlotKeyFromPeriodText(item.period,item.time);
        if(item.isBlock){
          summary.blockCount++;
          summary.slots[slotKey] = "blocked";
          summary.slotReasons[slotKey] = normalizeBlockReasonKey(item.blockReason || item.title || item.note || "");
        }else if(item.isBooking){
          summary.bookingCount++;
          summary.revenue += Number(item.amount || 0);
          summary.slots[slotKey] = "booked";
        }
      });
      cachedData.daySummary[dateText] = summary;

      return buildSlotPill(dateText, "\u4e0a\u5348", "morning", slots.morning || "open", reasons.morning || "") +

    function buildDayStatusClass(summary){
      var slots = summary.slots || {};
      var values = [
        slots.morning || "open",
        slots.afternoon || "open",
        slots.evening || "open"
      ];
      var openCount = values.filter(function(v){ return v === "open"; }).length;
      var bookedCount = values.filter(function(v){ return v === "booked"; }).length;
      var blockedCount = values.filter(function(v){ return v === "blocked"; }).length;

      var reasonClass = buildBlockReasonClass(getPrimaryBlockReason(summary));
      if(openCount === 3){ return "allFree"; }
      if(bookedCount === 3){ return "fullBooked"; }
      if(blockedCount === 3){ return "fullLocked " + reasonClass; }
      if(openCount > 0 && bookedCount > 0){ return "partialBooked"; }
      if(openCount > 0 && blockedCount > 0){ return "partialLocked " + reasonClass; }
      return "mixedStatus " + reasonClass;
    }

    function buildAdminOriginalCalendarDayClass(summary){
      var slots = summary.slots || {};
      var values = [
        slots.morning || "open",
        slots.afternoon || "open",
        slots.evening || "open"
      ];
      var openCount = values.filter(function(v){ return v === "open"; }).length;
      var bookedCount = values.filter(function(v){ return v === "booked"; }).length;
      var blockedCount = values.filter(function(v){ return v === "blocked"; }).length;
      var extra = "";

      if(Number(summary.bookingCount || 0) > 0){
        extra += " hasOrders";
      }
      if(Number(summary.blockCount || 0) > 0 || blockedCount > 0){
        extra += " hasBlocks";
      }

      if(openCount > 0){
        return "hasFree" + extra;
      }
      if(bookedCount > 0){
        return "fullBooked" + extra;
      }
      if(blockedCount > 0){
        return "fullClosed" + extra;
      }
      return extra;
    }

    function getPrimaryBlockReason(summary){
      var reasons = summary.slotReasons || {};
      return reasons.morning || reasons.afternoon || reasons.evening || "";
    }

    function buildBlockReasonClass(reason){
      if(reason === "rest"){ return "block-rest"; }
      if(reason === "reserve"){ return "block-reserve"; }
      if(reason === "other"){ return "block-other"; }
      return "";
    }

    function getBlockReasonText(reason){
      if(reason === "rest"){ return "\u4f11\u606f"; }
      if(reason === "reserve"){ return "\u4fdd\u7559"; }
      return "\u5176\u4ed6";
    }

    function buildSlotPill(dateText,label,slotKey,status,reason){
      var text = "\u958b\u653e";
      var cls = "open";
      var shortLabel = label;

      if(label === "\u4e0a\u5348"){
        shortLabel = "\u65e9";
      }else if(label === "\u4e0b\u5348"){
        shortLabel = "\u5348";
      }else if(label === "\u665a\u4e0a"){
        shortLabel = "\u665a";
      }

      if(status === "booked"){
        text = "\u5df2\u9810\u7d04";
        cls = "booked";
      }else if(status === "blocked"){
        text = getBlockReasonText(reason);
        cls = "blocked " + buildBlockReasonClass(reason);
      }

      return "<span class=\"slot-pill " + cls + "\" title=\"" + escapeAttr(label + " " + text) + "\">" +
        '<span class="slot-label">' + shortLabel + '</span>' +
        '<span class="slot-state">' + text + '</span>' +
        "</span>";
    }

    function renderSelectedDateSlotPanel(){
      if(!selectedDateText){ return ""; }

      var summary = cachedData.daySummary[selectedDateText] || {};
      var slots = summary.slots || {};
      var reasons = summary.slotReasons || {};
      var html = '<div id="selectedDayPanel" class="selectedDayPanel">';
      html += '<div class="selectedDayHead">';
      html += '<div><div class="selectedDayTitle">' + escapeHtml(selectedDateText) + ' \u6642\u6bb5\u7ba1\u7406</div>';
      html += '<div class="selectedDayHint">\u9ede\u9078\u4e0b\u65b9\u6642\u6bb5\u53ef\u4fee\u6539\u9810\u7d04\u3001\u5c01\u9396\u6216\u958b\u555f\u6642\u6bb5</div></div>';
      html += "<button class=\"chip-btn\" type=\"button\" onclick=\"openDayDetail('" + escapeJs(selectedDateText) + "')\">\u67e5\u770b\u5168\u65e5\u660e\u7d30</button>";
      html += '</div>';
      html += '<div class="selectedSlotList">';
      html += buildSelectedSlotCard(selectedDateText, "morning", "\u4e0a\u5348", slots.morning || "open", reasons.morning || "");
      html += buildSelectedSlotCard(selectedDateText, "afternoon", "\u4e0b\u5348", slots.afternoon || "open", reasons.afternoon || "");
      html += buildSelectedSlotCard(selectedDateText, "evening", "\u665a\u4e0a", slots.evening || "open", reasons.evening || "");
      html += '</div></div>';
      return html;
    }

    function buildSelectedSlotCard(dateText,slotKey,label,status,reason){
      var slotItems = getEventsForDateSlot(dateText, slotKey);
      var statusText = "\u958b\u653e\u4e2d";
      var subText = "\u76ee\u524d\u53ef\u63a5\u9810\u7d04";
      var actionText = "\u64cd\u4f5c";
      var clickStatus = status;

      if(status === "booked"){
        statusText = "\u5df2\u9810\u7d04";
        subText = slotItems.length ?
          slotItems.map(function(item){ return item.name || item.title || "\u5df2\u9810\u7d04"; }).join(" / ") :
          "\u5df2\u6709\u9810\u7d04\u884c\u7a0b";
        actionText = "\u4fee\u6539";
      }else if(status === "blocked"){
        statusText = "\u5df2\u5c01\u9396\uff5c" + getBlockReasonText(reason);
        subText = slotItems.length ?
          slotItems.map(function(item){ return item.title || "\u5c01\u9396\u6642\u6bb5"; }).join(" / ") :
          "\u9ede\u9078\u53ef\u91cd\u65b0\u958b\u555f\u6642\u6bb5";
        actionText = "\u958b\u555f";
      }

      var cardClass = status + (status === "blocked" ? " " + buildBlockReasonClass(reason) : "");
      var html = "<div class=\"selectedSlotCard " + escapeAttr(cardClass) + "\" onclick=\"openSelectedSlotAction('" +
        escapeJs(dateText) + "','" +
        escapeJs(slotKey) + "','" +
        escapeJs(clickStatus) +
        "')\">";
      html += '<div class="selectedSlotRow">' +
        '<div class="selectedSlotPeriod">' + label + '</div>' +
        '<div class="selectedSlotMain">' +
        '<div class="selectedSlotStatus">' + statusText + '</div>' +
        '<div class="selectedSlotSub">' + escapeHtml(subText) + '</div>' +
        '</div>' +
        '<div class="selectedSlotAction">' + actionText + '</div>' +
        '</div>';

      if(status === "booked" && expandedSlotKey === slotKey && slotItems.length){
        html += '<div class="selectedBookingList">';
        slotItems.filter(function(item){ return item.isBooking; }).forEach(function(item){
          html += buildSelectedBookingItem(item);
        });
        html += '</div>';
      }

      html += '</div>';
      return html;
    }

    function buildSelectedBookingItem(item){
      var eventArg = encodeEventArg(item.eventId);
      var mapUrl = item.address ?
        'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(item.address) :
        '';
      var html = '<div class="selectedBookingItem" onclick="event.stopPropagation()">';
      html += '<div class="selectedBookingName">' + escapeHtml(item.name || item.title || "\u5df2\u9810\u7d04") + '</div>';
      html += '<div class="selectedBookingDetail">';
      html += '\u6642\u9593\uff1a' + escapeHtml(formatBookingPeriodTime(item));
      if(item.phone){ html += "\n\u96fb\u8a71\uff1a" + escapeHtml(item.phone); }
      if(item.address){ html += "\n\u5730\u5740\uff1a" + escapeHtml(item.address); }
      if(item.service){ html += "\n\u670d\u52d9\uff1a" + escapeHtml(item.service); }
      html += "\n\u91d1\u984d\uff1a" + escapeHtml(formatAmountText(item.amount));
      if(item.note){ html += "\n\u5099\u8a3b\uff1a" + escapeHtml(item.note); }
      html += '</div>';
      html += '<div class="selectedBookingActions">';
      html += "<button class=\"action-btn primary\" type=\"button\" onclick=\"event.stopPropagation();openEditBookingFormByArg('" + eventArg + "')\">\u4fee\u6539</button>";
      html += "<button class=\"action-btn danger\" type=\"button\" onclick=\"event.stopPropagation();confirmAppDeleteBookingByArg('" + eventArg + "')\">\u522a\u9664</button>";
      html += "<button class=\"action-btn reminder\" type=\"button\" onclick=\"event.stopPropagation();copyReminderTextByArg('" + eventArg + "')\">\u63d0\u9192\u6587</button>";
      html += "<button class=\"action-btn payment\" type=\"button\" onclick=\"event.stopPropagation();openPaymentInfoByArg('" + eventArg + "')\">\u4ed8\u6b3e</button>";
      if(isRecurringBookingItem(item)){
        html += "<button class=\"action-btn recurringGroup\" type=\"button\" onclick=\"event.stopPropagation();openRecurringGroupByArg('" + eventArg + "')\">\u5f8c\u7e8c\u9810\u7d04</button>";
      }
      html += item.phone ? '<a class="action-link call-link" href="tel:' + escapeAttr(item.phone) + '" onclick="event.stopPropagation()">\u64a5\u865f</a>' : '';
      html += mapUrl ? '<a class="action-link map-link" href="' + escapeAttr(mapUrl) + '" target="_blank" onclick="event.stopPropagation()">\u5730\u5716</a>' : '';
      html += '</div></div>';
      return html;
    }

    function formatBookingPeriodTime(item){
      var time =
        String(item && item.time ? item.time : "")
          .replace(/\s+/g," ")
          .trim();

      if(time){
        return time;
      }

      var period =
        String(item && item.period ? item.period : "")
          .replace(/\s+/g," ")
          .trim();
      var timeMatch =
        period.match(/\d{1,2}:\d{2}\s*-\s*\d{1,2}:\d{2}/);

      if(timeMatch){
        return timeMatch[0].replace(/\s+/g,"");
      }

      return period;
    }

    function formatAmountText(amount){
      var value = Number(amount || 0);
      if(!value){
        return "\u672a\u586b\u5beb";
      }
      return "$" + value.toLocaleString();
    }

    function openPaymentInfoByArg(eventArg){
      var item =
        findCachedEvent(
          decodeEventArg(eventArg)
        );

      if(!item){
        Swal.fire(
          "\u627e\u4e0d\u5230\u8cc7\u6599",
          "\u8acb\u91cd\u65b0\u8f09\u5165\u5f8c\u518d\u8a66\u3002",
          "warning"
        );
        return;
      }

      openPaymentInfo(item);
    }

    function openPaymentInfo(item){
      getAdminPaymentConfig(function(config){
        var paymentText =
          buildPaymentInfoText(item,config);
        var hasConfig =
          !!(
            config.paymentLink ||
            config.accountNo ||
            config.bankName
          );
        var html = '<div class="payment-card">';

        html += '<div class="payment-card-head">';
        html += '<div>\u6536\u6b3e\u5c0f\u5361\uff5c' + escapeHtml(item.name || item.title || "\u5ba2\u4eba") + '</div>';
        html += '<div class="payment-amount">' + escapeHtml(formatAmountText(item.amount)) + '</div>';
        html += '<div style="font-size:12px;color:#92400e;margin-top:4px;">' +
          escapeHtml((item.dateText || "") + " " + (item.period || "") + " " + (item.time || "")) +
          '</div>';
        html += '</div>';

        if(!hasConfig){
          html += '<div class="payment-lines" style="border-color:#fecaca;background:#fff7f7;color:#991b1b;">' +
            '\u5c1a\u672a\u8a2d\u5b9a\u56fa\u5b9a\u6536\u6b3e\u8cc7\u8a0a\u3002\\n' +
            '\u53ef\u5148\u8907\u88fd\u4e0b\u65b9\u6587\u5b57\u7d66\u5ba2\u4eba\uff0c\u6216\u5728 Script Properties \u8a2d\u5b9a ADMIN_PAYMENT_ACCOUNT_NO / ADMIN_PAYMENT_LINK\u3002' +
            '</div>';
        }

        html += '<div class="payment-lines">' + escapeHtml(paymentText) + '</div>';
        html += '<div class="work-actions">';
        html += "<button class=\"action-btn payment\" type=\"button\" onclick=\"copyPaymentTextByArg('" + encodeEventArg(JSON.stringify({ item:item, config:config })) + "')\">\u8907\u88fd\u4ed8\u6b3e\u6587\u5b57</button>";
        if(config.paymentLink){
          html += '<a class="action-link map-link" href="' + escapeAttr(config.paymentLink) + '" target="_blank">\u958b\u555f\u4ed8\u6b3e\u9023\u7d50</a>';
        }
        html += '<button class="action-btn" type="button" onclick="closeDrawer()">\u95dc\u9589</button>';
        html += '</div>';
        html += '</div>';

        openDrawer(
          "\u4ed8\u6b3e\u8cc7\u8a0a",
          html
        );
      });
    }

    function getAdminPaymentConfig(callback){
      if(adminPaymentConfig){
        callback(adminPaymentConfig);
        return;
      }

      google.script.run
        .withSuccessHandler(function(config){
          adminPaymentConfig =
            normalizeAdminPaymentConfig(config || {});
          callback(adminPaymentConfig);
        })
        .withFailureHandler(function(){
          adminPaymentConfig =
            normalizeAdminPaymentConfig({});
          callback(adminPaymentConfig);
        })
        .getAdminAppPaymentConfig();
    }

    function normalizeAdminPaymentConfig(config){
      return {
        methodName:String(config.methodName || "\u9280\u884c\u8f49\u5e33"),
        bankName:String(config.bankName || ""),
        bankCode:String(config.bankCode || ""),
        accountName:String(config.accountName || ""),
        accountNo:String(config.accountNo || ""),
        paymentLink:String(config.paymentLink || ""),
        note:String(config.note || "\u8f49\u5e33\u5f8c\u8acb\u56de\u50b3\u5f8c\u4e94\u78bc\uff0c\u6211\u5011\u6703\u76e1\u5feb\u70ba\u60a8\u78ba\u8a8d\u3002")
      };
    }

    function buildPaymentInfoText(item,config){
      var lines = [
        "\u3010\u91cc\u6b50\u5c45\u5bb6\u6e05\u6f54\uff5c\u4ed8\u6b3e\u8cc7\u8a0a\u3011",
        "",
        "\u5ba2\u6236\uff1a" + (item.name || item.title || ""),
        "\u65e5\u671f\uff1a" + (item.dateText || ""),
        "\u6642\u9593\uff1a" + ((item.period || "") + " " + (item.time || "")).trim(),
        "\u91d1\u984d\uff1a" + formatAmountText(item.amount),
        "",
        "\u4ed8\u6b3e\u65b9\u5f0f\uff1a" + (config.methodName || "\u9280\u884c\u8f49\u5e33")
      ];

      if(config.bankName){
        lines.push("\u9280\u884c\uff1a" + config.bankName);
      }
      if(config.bankCode){
        lines.push("\u9280\u884c\u4ee3\u78bc\uff1a" + config.bankCode);
      }
      if(config.accountName){
        lines.push("\u6236\u540d\uff1a" + config.accountName);
      }
      if(config.accountNo){
        lines.push("\u5e33\u865f\uff1a" + config.accountNo);
      }
      if(config.paymentLink){
        lines.push("\u4ed8\u6b3e\u9023\u7d50\uff1a" + config.paymentLink);
      }
      if(config.note){
        lines.push("");
        lines.push(config.note);
      }

      return lines.join("\n");
    }

    function copyPaymentTextByArg(payloadArg){
      var payload = {};
      try{
        payload =
          JSON.parse(
            decodeEventArg(payloadArg) || "{}"
          );
      }catch(error){
        payload = {};
      }

      copyTextToClipboard(
        buildPaymentInfoText(
          payload.item || {},
          normalizeAdminPaymentConfig(payload.config || {})
        ),
        "\u4ed8\u6b3e\u6587\u5b57\u5df2\u8907\u88fd\uff0c\u53ef\u76f4\u63a5\u8cbc\u7d66\u5ba2\u4eba\u3002"
      );
    }

    function openSelectedSlotAction(dateText,slotKey,status){
      if(status === "booked"){
        var slotItems = getEventsForDateSlot(dateText, slotKey).filter(function(item){ return item.isBooking; });
        expandedSlotKey = expandedSlotKey === slotKey ? "" : slotKey;
        renderCalendarTab();
        var panel = document.getElementById("selectedDayPanel");
        if(panel){
          setTimeout(function(){
            panel.scrollIntoView({ behavior:"smooth", block:"nearest" });
          }, 80);
        }
        return;
      }
      if(status === "open"){
        openAvailableSlotMenu(dateText, slotKey);
        return;
      }
      openSlotAction(dateText, slotKey, status);
    }

    function isRecurringBookingItem(item){
      return String((item && item.title) || "").indexOf("\u56fa\u5b9a\u5ba2") >= 0;
    }

    function openRecurringGroupByArg(eventArg){
      var eventId = decodeEventArg(eventArg);
      var timeoutId;
      var finished = false;

      function finishLoading(){
        if(finished){ return false; }
        finished = true;
        if(timeoutId){ clearTimeout(timeoutId); }
        setLoading(false);
        return true;
      }

      setLoading(true);
      timeoutId = setTimeout(function(){
        if(!finishLoading()){ return; }
        Swal.fire(
          "\u8b80\u53d6\u8f03\u4e45",
          "\u5f8c\u7e8c\u9810\u7d04\u67e5\u8a62\u8d85\u904e 15 \u79d2\uff0c\u8acb\u9ede\u91cd\u8f09\u5f8c\u518d\u8a66\u3002",
          "warning"
        );
      }, 15000);

      google.script.run
        .withSuccessHandler(function(result){
          if(!finishLoading()){ return; }
          try{
            renderRecurringGroupDrawer(result || { status:"ERROR", bookings:[] }, eventId);
          }catch(error){
            Swal.fire(
              "\u756b\u9762\u986f\u793a\u5931\u6557",
              error && error.message ? error.message : "\u5f8c\u7e8c\u9810\u7d04\u8cc7\u6599\u7121\u6cd5\u986f\u793a",
              "error"
            );
          }
        })
        .withFailureHandler(function(err){
          if(!finishLoading()){ return; }
          Swal.fire("\u8b80\u53d6\u5931\u6557", err && err.message ? err.message : "\u7121\u6cd5\u8b80\u53d6\u5f8c\u7e8c\u9810\u7d04", "error");
        })
        .getAdminAppRecurringGroupBookings(eventId);
    }

    function renderRecurringGroupDrawer(result,sourceEventId){
      if(result.status !== "OK"){
        Swal.fire("\u8b80\u53d6\u5931\u6557", result.message || "\u7121\u6cd5\u8b80\u53d6\u5f8c\u7e8c\u9810\u7d04", "error");
        return;
      }

      var html = '<div class="work-detail" style="margin-bottom:10px;">';
      html += '\u5ba2\u4eba\uff1a' + escapeHtml(result.name || "") + "\n";
      if(result.phone){ html += '\u96fb\u8a71\uff1a' + escapeHtml(result.phone) + "\n"; }
      html += '\u672a\u4f86 12 \u500b\u6708\u5171 ' + Number(result.count || 0) + ' \u7b46\u56fa\u5b9a\u5ba2\u9810\u7d04';
      html += '</div>';

      if(!result.bookings || !result.bookings.length){
        html += '<div class="empty">\u76ee\u524d\u6c92\u6709\u5f8c\u7e8c\u56fa\u5b9a\u5ba2\u9810\u7d04</div>';
        openDrawer("\u5f8c\u7e8c\u9810\u7d04", html);
        return;
      }

      html += '<div class="work-actions" style="margin-bottom:10px;">';
      html += '<button class="action-btn" type="button" onclick="setRecurringGroupChecks(true)">\u5168\u9078</button>';
      html += '<button class="action-btn" type="button" onclick="setRecurringGroupChecks(false)">\u53d6\u6d88</button>';
      html += "<button class=\"action-btn primary\" type=\"button\" onclick=\"updateCheckedRecurringGroupInfo('" + escapeJs(encodeEventArg(sourceEventId)) + "')\">\u5957\u7528\u76ee\u524d\u8cc7\u6599</button>";
      html += '<button class="action-btn recurringGroup" type="button" onclick="openRecurringRescheduleDialog()">\u6279\u6b21\u6539\u671f</button>';
      html += '<button class="action-btn danger" type="button" onclick="confirmDeleteCheckedRecurringGroup()">\u522a\u9664\u52fe\u9078</button>';
      html += '</div>';
      html += '<div class="list">';
      result.bookings.forEach(function(item){
        html += buildRecurringGroupItem(item);
      });
      html += '</div>';
      openDrawer("\u5f8c\u7e8c\u9810\u7d04", html);
    }

    function buildRecurringGroupItem(item){
      var eventArg = encodeEventArg(item.eventId);
      var html = '<div class="work-card">';
      html += '<div class="work-top"><div class="work-time">' + escapeHtml((item.dateText || "") + " " + (item.period || "") + " " + (item.time || "")) + '</div>' + buildPaymentBadge(item.paymentStatus) + '</div>';
      html += '<label class="work-name" style="display:flex;align-items:center;gap:8px;">';
      html += '<input type="checkbox" class="recurringGroupCheck" value="' + escapeAttr(item.eventId) + '">';
      html += '<span>' + escapeHtml(item.name || "\u56fa\u5b9a\u5ba2") + '</span></label>';
      html += '<div class="work-detail">';
      if(item.address){ html += '\u5730\u5740\uff1a' + escapeHtml(item.address) + "\n"; }
      if(item.service){ html += '\u670d\u52d9\uff1a' + escapeHtml(item.service) + "\n"; }
      if(item.amount){ html += '\u91d1\u984d\uff1a$' + Number(item.amount || 0).toLocaleString(); }
      html += '</div>';
      html += '<div class="work-actions">';
      html += "<button class=\"action-btn primary\" type=\"button\" onclick=\"event.stopPropagation();openEditBookingFormByArg('" + eventArg + "')\">\u4fee\u6539</button>";
      html += "<button class=\"action-btn danger\" type=\"button\" onclick=\"event.stopPropagation();confirmAppDeleteBookingByArg('" + eventArg + "')\">\u522a\u9664</button>";
      html += '</div></div>';
      return html;
    }

    function setRecurringGroupChecks(checked){
      document.querySelectorAll(".recurringGroupCheck").forEach(function(input){
        input.checked = !!checked;
      });
    }

    function getCheckedRecurringGroupEventIds(){
      var ids = [];
      document.querySelectorAll(".recurringGroupCheck:checked").forEach(function(input){
        ids.push(input.value);
      });
      return ids;
    }

    function confirmDeleteCheckedRecurringGroup(){
      var ids = getCheckedRecurringGroupEventIds();
      if(!ids.length){
        Swal.fire("\u8acb\u5148\u52fe\u9078","\u8acb\u52fe\u9078\u8981\u522a\u9664\u7684\u5f8c\u7e8c\u56fa\u5b9a\u5ba2\u9810\u7d04\u3002","warning");
        return;
      }

      Swal.fire({
        icon:"warning",
        title:"\u522a\u9664\u52fe\u9078\u9810\u7d04\uff1f",
        text:"\u5c07\u522a\u9664 " + ids.length + " \u7b46\u56fa\u5b9a\u5ba2\u9810\u7d04\uff0c\u522a\u9664\u5f8c\u6703\u5f9e\u884c\u4e8b\u66c6\u79fb\u9664\u3002",
        showCancelButton:true,
        confirmButtonText:"\u522a\u9664",
        cancelButtonText:"\u53d6\u6d88",
        confirmButtonColor:"#dc2626",
        cancelButtonColor:"#64748b"
      }).then(function(result){
        if(result && result.isConfirmed){
          deleteCheckedRecurringGroup(ids);
        }
      });
    }

    function deleteCheckedRecurringGroup(ids){
      setLoading(true);
      google.script.run
        .withSuccessHandler(function(result){
          setLoading(false);
          closeDrawer();
          Swal.fire(
            "\u5df2\u522a\u9664",
            "\u522a\u9664 " + Number(result.deleted || 0) + " \u7b46\uff0c\u7565\u904e " + Number(result.skipped || 0) + " \u7b46\u3002",
            "success"
          );
          reloadCurrentData();
        })
        .withFailureHandler(function(err){
          setLoading(false);
          Swal.fire("\u522a\u9664\u5931\u6557", err && err.message ? err.message : "\u8acb\u7a0d\u5f8c\u518d\u8a66", "error");
        })
        .deleteAdminAppRecurringBookings(ids);
    }

    function updateCheckedRecurringGroupInfo(sourceEventArg){
      var ids = getCheckedRecurringGroupEventIds();
      if(!ids.length){
        Swal.fire("\u8acb\u5148\u52fe\u9078","\u8acb\u52fe\u9078\u8981\u5957\u7528\u76ee\u524d\u8cc7\u6599\u7684\u5f8c\u7e8c\u56fa\u5b9a\u5ba2\u9810\u7d04\u3002","warning");
        return;
      }

      Swal.fire({

    function buildAdminAppReminderText(item){
      var lines = [

        "\u6642\u9593\uff1a" + ((item.period || "") + " " + (item.time || "")).trim()
      ];

      if(item.service){
        lines.push("\u670d\u52d9\uff1a" + item.service);

      if(item.address){
        lines.push("\u5730\u5740\uff1a" + item.address);

      lines.push("\u5982\u9700\u8abf\u6574\u6216\u6709\u5176\u4ed6\u9700\u6c42\uff0c\u8acb\u76f4\u63a5\u56de\u8986\u6b64 LINE \u8207\u6211\u5011\u806f\u7e6b\uff0c\u8b1d\u8b1d\u60a8\u3002");

    function copyTextToClipboard(text,successMessage){
      text = String(text || "");
      if(!text){
        Swal.fire("\u7121\u5167\u5bb9","\u76ee\u524d\u6c92\u6709\u53ef\u8907\u88fd\u7684\u6587\u5b57\u3002","info");
        return;
      }

      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard
          .writeText(text)
          .then(function(){
            Swal.fire("\u5df2\u8907\u88fd", successMessage || "\u6587\u5b57\u5df2\u8907\u88fd\u3002", "success");
          })
          .catch(function(){
            copyTextToClipboardFallback(text,successMessage);
          });
        return;
      }

      copyTextToClipboardFallback(text,successMessage);
    }

    function copyTextToClipboardFallback(text,successMessage){
      var area = document.createElement("textarea");
      var copied = false;
      area.value = text;
      area.setAttribute("readonly","readonly");
      area.style.position = "fixed";
      area.style.left = "-9999px";
      document.body.appendChild(area);
      area.select();
      try{
        copied = document.execCommand("copy");
      }catch(error){
        copied = false;
      }
      document.body.removeChild(area);

      if(copied){
        Swal.fire("\u5df2\u8907\u88fd", successMessage || "\u6587\u5b57\u5df2\u8907\u88fd\u3002", "success");
      }else{
        Swal.fire("\u8acb\u624b\u52d5\u8907\u88fd", "<pre style='white-space:pre-wrap;text-align:left;font-size:13px;'>" + escapeHtml(text) + "</pre>", "info");
      }
    }

    function scheduleAdminAppAutofill(prefix){
      if(adminAppAutofillTimers[prefix]){
        clearTimeout(adminAppAutofillTimers[prefix]);
      }
      adminAppAutofillTimers[prefix] = setTimeout(function(){
        lookupAdminAppAutofill(prefix,false);
