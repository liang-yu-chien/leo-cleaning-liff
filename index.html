    function lookupAdminAppAutofill(prefix,force){
      var refs = getAdminAppAutofillRefs(prefix);
      var name = refs.name ? refs.name.value.trim() : "";
      var phone = refs.phone ? refs.phone.value.replace(/[^0-9]/g,"") : "";
      var queryKey = name + "|" + phone;
      var requestSeq;

      if(!force && phone.length < 8){
        if(refs.hint){
          refs.hint.textContent = name.length >= 2 ?
            "\u70ba\u907f\u514d\u6293\u932f\u5ba2\u4eba\uff0c\u59d3\u540d\u641c\u5c0b\u8acb\u9ede\u300c\u5e36\u5165\u820a\u5ba2\u300d" :
            "\u8f38\u5165\u96fb\u8a71\u6eff 8 \u78bc\u5f8c\u6703\u81ea\u52d5\u641c\u5c0b\u820a\u5ba2";
        }
        return;
      }

      if(force && phone.length < 4 && name.length < 2){
        if(refs.hint){
          refs.hint.textContent = "\u8acb\u5148\u8f38\u5165\u59d3\u540d\u6216\u96fb\u8a71\u518d\u5e36\u5165";
        }
        return;
      }

      if(!force && adminAppAutofillLastQuery[prefix] === queryKey){
        return;
      }

      adminAppAutofillLastQuery[prefix] = queryKey;
      adminAppAutofillSeq[prefix] = (adminAppAutofillSeq[prefix] || 0) + 1;
      requestSeq = adminAppAutofillSeq[prefix];

      if(refs.hint){
        refs.hint.textContent = "\u6b63\u5728\u641c\u5c0b\u820a\u5ba2\u8cc7\u6599...";
      }

      google.script.run
        .withSuccessHandler(function(data){
          if(requestSeq !== adminAppAutofillSeq[prefix]){
            return;
          }
          applyAdminAppAutofill(prefix,data,force);
        })
        .withFailureHandler(function(err){
          if(requestSeq !== adminAppAutofillSeq[prefix]){
            return;
          }
          if(refs.hint){
            refs.hint.textContent = "\u820a\u5ba2\u8cc7\u6599\u641c\u5c0b\u5931\u6557";
          }
          if(force){
            if(refs.hint){
              refs.hint.textContent =
                "\u5e36\u5165\u5931\u6557\uff1a" +
                (err && err.message ? err.message : "\u8acb\u7a0d\u5f8c\u518d\u8a66");
            }
          }
        })
        .findCustomerAutofillProfile({
          name:name,
          phone:phone
        });
    }

    function applyAdminAppAutofill(prefix,data,force){
      var refs = getAdminAppAutofillRefs(prefix);
      var changed = 0;
      var currentName =
        refs.name ? refs.name.value.trim() : "";
      var currentPhone =
        refs.phone ? refs.phone.value.replace(/[^0-9]/g,"") : "";
      var dataPhone =
        String(data && data.phone || "").replace(/[^0-9]/g,"");

      if(!data || !data.found){
        if(refs.hint){
          refs.hint.textContent = "\u6c92\u6709\u627e\u5230\u7b26\u5408\u7684\u820a\u5ba2\u8cc7\u6599";
        }
        if(force){
          if(refs.hint){
            refs.hint.textContent =
              "\u627e\u4e0d\u5230\u7b26\u5408\u7684\u820a\u5ba2\u8cc7\u6599\uff0c\u53ef\u76f4\u63a5\u5efa\u7acb\u65b0\u5ba2";
          }
        }
        return;
      }

      if(
        !force &&
        currentPhone.length >= 8 &&
        dataPhone &&
        dataPhone.slice(-8) !== currentPhone.slice(-8)
      ){
        if(refs.hint){
          refs.hint.textContent = "\u627e\u5230\u76f8\u4f3c\u8cc7\u6599\uff0c\u4f46\u96fb\u8a71\u4e0d\u4e00\u81f4\uff0c\u5df2\u505c\u6b62\u81ea\u52d5\u5e36\u5165";
        }
        return;
      }

      if(
        !force &&
        currentName &&
        data.name &&
        normalizeAdminAppAutofillText(currentName) !== normalizeAdminAppAutofillText(data.name)
      ){
        if(refs.hint){
          refs.hint.textContent = "\u96fb\u8a71\u627e\u5230\u820a\u5ba2\uff0c\u4f46\u59d3\u540d\u4e0d\u540c\uff0c\u8acb\u9ede\u300c\u5e36\u5165\u820a\u5ba2\u300d\u78ba\u8a8d";
        }
        return;
      }

      if(refs.name && (force || refs.name.value.trim() === "")){
        refs.name.value = data.name || refs.name.value;
        changed++;
      }
      if(refs.phone && (force || refs.phone.value.trim() === "")){
        refs.phone.value = data.phone || refs.phone.value;
        changed++;
      }
      if(refs.address && (force || refs.address.value.trim() === "")){
        refs.address.value = data.address || refs.address.value;
        changed++;
      }
      if(refs.note && refs.note.value.trim() === ""){
        refs.note.value = data.note || refs.note.value;
        if(data.note){ changed++; }
      }

      if(refs.hint){
        refs.hint.textContent =
          "\u5df2\u627e\u5230\u820a\u5ba2" +
          (data.sourceDate ? "\uff08\u4f86\u6e90\uff1a" + data.sourceDate + "\uff09" : "") +
          (changed ? "\uff0c\u5df2\u5e36\u5165\u7a7a\u767d\u6b04\u4f4d" : "\uff0c\u8cc7\u6599\u5df2\u5728\u8868\u55ae\u4e2d");
      }

      if(force && changed && refs.hint){
        refs.hint.textContent =
          "\u5df2\u5e36\u5165\u820a\u5ba2\u8cc7\u6599\uff0c\u8acb\u78ba\u8a8d\u5167\u5bb9\u5f8c\u5efa\u7acb";
      }
    }

    function normalizeAdminAppAutofillText(value){
      return String(value || "")
        .replace(/\s+/g,"")
        .toLowerCase();
    }

    function createTempBooking(data){
      if(!data.name || !data.phone || !data.address){
        Swal.fire("\u8cc7\u6599\u4e0d\u5b8c\u6574","\u8acb\u586b\u5beb\u59d3\u540d\u3001\u96fb\u8a71\u8207\u5730\u5740\u3002","warning");
        return;
      }
      var mutationKey =
        "temp:" + data.dateText + ":" + data.slotKey;

      if(!beginAdminMutation(mutationKey)){
        return;
      }

      showInlineActionLoading("\u5efa\u7acb\u9810\u7d04\u4e2d...");
      google.script.run
        .withSuccessHandler(function(result){
          endAdminMutation(mutationKey);
          closeInlineActionLoading();
          if(result && result.status === "BOOKED"){
            Swal.fire("\u5efa\u7acb\u5931\u6557","\u9019\u500b\u6642\u6bb5\u5df2\u6709\u9810\u7d04\u6216\u5c01\u9396\u3002","warning");
            reloadCurrentData();
            return;
          }
          if(result && result.event){
            upsertCachedEventLocally(result.event);
          }
          Swal.fire({
            toast:true,
            position:"top",
            icon:"success",
            title:"\u81e8\u6642\u5ba2\u9810\u7d04\u5df2\u5efa\u7acb",
            showConfirmButton:false,
            timer:1400
          });
          syncDataAfterFastUiUpdate(data.dateText);
        })
        .withFailureHandler(function(err){
          endAdminMutation(mutationKey);
          closeInlineActionLoading();
          Swal.fire("\u5efa\u7acb\u5931\u6557", err && err.message ? err.message : "\u8acb\u7a0d\u5f8c\u518d\u8a66", "error");
        })
        .createAdminAppTempBooking(data);
    }

    function openRecurringBookingForm(dateText,slotKey){
      var label = getSlotLabel(slotKey);
      var html = '<div class="edit-grid">';
      html += '<div><div class="edit-label">\u59d3\u540d</div><input id="recName" class="edit-input" autocomplete="name" oninput="scheduleAdminAppAutofill(\'rec\')"></div>';
      html += '<div><div class="edit-label">\u96fb\u8a71</div><input id="recPhone" class="edit-input" inputmode="numeric" autocomplete="tel" oninput="this.value=this.value.replace(/[^0-9]/g,\'\');scheduleAdminAppAutofill(\'rec\')"></div>';
      html += buildAdminAppAutofillRow("rec");
      html += '<div><div class="edit-label">\u5730\u5740</div><input id="recAddress" class="edit-input" autocomplete="street-address"></div>';
      html += selectHtml("recIntervalDays", "\u9031\u671f", "7", [["7","\u6bcf\u9031"],["14","\u96d9\u9031"],["28","\u56db\u9031"]]);
      html += selectHtml("recMonths", "\u5efa\u7acb\u6708\u6578", "1", [["1","1 \u500b\u6708"],["2","2 \u500b\u6708"],["3","3 \u500b\u6708"],["6","6 \u500b\u6708"]]);
      html += selectHtml("recService", "\u670d\u52d9", "", ["","\u4e00\u822c\u6e05\u6f54","\u5927\u6383\u9664","\u7a7a\u5c4b\u6e05\u6f54","\u88dd\u6f62\u5f8c\u6e05\u6f54","\u5176\u4ed6"]);
      html += selectHtml("recRoomType", "\u576a\u6578/\u623f\u578b", "", ["","\u5957\u623f","1\u623f","2\u623f","3\u623f","4\u623f\u4ee5\u4e0a","\u5176\u4ed6 / \u5099\u8a3b\u586b\u5beb"]);
      html += selectHtml("recPet", "\u5bf5\u7269", "", ["","\u7121\u5bf5\u7269","\u6709\u8c93","\u6709\u72d7","\u5176\u4ed6\u5bf5\u7269"]);
      html += '<div><div class="edit-label">\u91d1\u984d</div><input id="recAmount" class="edit-input" inputmode="numeric" placeholder="\u4f8b\uff1a2500"></div>';
      html += selectHtml("recPaymentStatus", "\u6536\u6b3e\u72c0\u614b", "\u672a\u6536\u6b3e", ["\u672a\u6536\u6b3e","\u5df2\u6536\u8a02\u91d1","\u5df2\u6536\u5168\u984d","\u73fe\u5834\u4ed8\u6b3e","\u514d\u8a02\u91d1"]);
      html += '<div><div class="edit-label">\u5099\u8a3b</div><textarea id="recNote" class="edit-input"></textarea></div>';
      html += '</div>';

      Swal.fire({
        title:"\u5efa\u7acb\u56fa\u5b9a\u5ba2",
        html:'<div style="font-size:13px;font-weight:800;color:#64748b;margin-bottom:10px;">' + escapeHtml(dateText + " " + label) + '</div>' + html,
        showCancelButton:true,
        confirmButtonText:"\u5efa\u7acb\u56fa\u5b9a\u9810\u7d04",
        cancelButtonText:"\u53d6\u6d88",
        confirmButtonColor:"#2563eb",
        focusConfirm:false,
        preConfirm:function(){
          return {
            dateText:dateText,
            slotKey:slotKey,
            name:getInputValue("recName"),
            phone:getInputValue("recPhone").replace(/[^0-9]/g,""),
            address:getInputValue("recAddress"),
            recurringIntervalDays:getInputValue("recIntervalDays") || "7",
            months:getInputValue("recMonths") || "1",
            service:getInputValue("recService"),
            roomType:getInputValue("recRoomType"),
            pet:getInputValue("recPet"),
            amount:getInputValue("recAmount").replace(/[^0-9]/g,""),
            paymentStatus:getInputValue("recPaymentStatus") || "\u672a\u6536\u6b3e",
            note:getInputValue("recNote")
          };
        }
      }).then(function(result){
        if(result && result.isConfirmed){
          createRecurringBooking(result.value);
        }
      });
    }

    function createRecurringBooking(data){
      if(!data.name || !data.phone || !data.address){
        Swal.fire("\u8cc7\u6599\u4e0d\u5b8c\u6574","\u8acb\u586b\u5beb\u59d3\u540d\u3001\u96fb\u8a71\u8207\u5730\u5740\u3002","warning");
        return;
      }
      setLoading(true);
      google.script.run
        .withSuccessHandler(function(result){
          setLoading(false);
          Swal.fire(
            "\u5efa\u7acb\u5b8c\u6210",
            "\u5df2\u5efa\u7acb " + (result.created || 0) + " \u7b46\uff0c\u7565\u904e " + (result.skipped || 0) + " \u7b46\u885d\u7a81\u6642\u6bb5\u3002",
            "success"
          );
          reloadDataKeepSelected(data.dateText);
        })
        .withFailureHandler(function(err){
          setLoading(false);
          Swal.fire("\u5efa\u7acb\u5931\u6557", err && err.message ? err.message : "\u8acb\u7a0d\u5f8c\u518d\u8a66", "error");
        })
        .createAdminAppRecurringBooking(data);
    }

    function getEventsForDateSlot(dateText,slotKey){
      return cachedData.events.filter(function(item){
        return item.dateText === dateText && getSlotKeyFromPeriodText(item.period, item.time) === slotKey;
      });
    }

    function getSlotKeyFromPeriodText(period,timeText){
      var text = String(period || "") + " " + String(timeText || "");
      if(text.indexOf("\u4e0a\u5348") >= 0){ return "morning"; }
      if(text.indexOf("\u4e0b\u5348") >= 0){ return "afternoon"; }
      if(text.indexOf("\u665a\u4e0a") >= 0){ return "evening"; }
      var hourMatch = String(timeText || "").match(/(\d{1,2}):/);
      var hour = hourMatch ? Number(hourMatch[1]) : 0;
      if(hour < 12){ return "morning"; }
      if(hour < 18){ return "afternoon"; }
      return "evening";
    }

    function openSlotActionByArg(dateArg,slotArg,statusArg){
      openSlotAction(
        decodeEventArg(dateArg),
        decodeEventArg(slotArg),
        decodeEventArg(statusArg)
      );
    }

    function openSlotAction(dateText,slotKey,status){
      var label = getSlotLabel(slotKey);

      if(status === "booked"){
        openDayDetail(dateText);
        return;
      }

      if(status === "blocked"){
        Swal.fire({
          icon:"question",
          title:"\u8981\u958b\u555f\u6642\u6bb5\u55ce\uff1f",
          text:dateText + " " + label,
          showCancelButton:true,
          confirmButtonText:"\u958b\u555f\u6642\u6bb5",
          cancelButtonText:"\u53d6\u6d88",
          confirmButtonColor:"#2f7d57"
        }).then(function(result){
          if(result && result.isConfirmed){
            updateSlotState(dateText, slotKey, "unlock", "");
          }
        });
        return;
      }

      chooseBlockReasonAndLock(dateText, slotKey, label);
    }

    function chooseBlockReasonAndLock(dateText,slotKey,label){
      var html = '<div style="font-size:13px;font-weight:800;color:#64748b;margin-bottom:12px;">' + escapeHtml(dateText + " " + label) + '</div>';
      html += '<div class="choice-grid" id="blockReasonButtons">';
      html += '<button type="button" class="choice-btn block-reason-btn rest" data-reason="\u4f11\u606f">\u4f11\u606f</button>';
      html += '<button type="button" class="choice-btn block-reason-btn reserve" data-reason="\u4fdd\u7559">\u4fdd\u7559</button>';
      html += '<button type="button" class="choice-btn block-reason-btn other" data-reason="\u5176\u4ed6">\u5176\u4ed6</button>';
      html += '</div>';
      Swal.fire({
        icon:"question",
        title:"\u9078\u64c7\u5c01\u9396\u539f\u56e0",
        html:html,
        showCancelButton:true,
        cancelButtonText:"\u53d6\u6d88",
        showConfirmButton:false,
        didOpen:function(){
          var container = document.getElementById("blockReasonButtons");
          if(!container){ return; }
          Array.prototype.forEach.call(container.querySelectorAll("button[data-reason]"),function(button){
            button.addEventListener("click",function(){
              var reason = this.getAttribute("data-reason") || "\u4f11\u606f";
              Swal.close();
              setTimeout(function(){
                if(reason === "\u5176\u4ed6"){
                  askCustomBlockReason(dateText, slotKey);
                  return;
                }
                updateSlotState(dateText, slotKey, "lock", reason);
              },80);
            });
          });
        }
      });
    }

    function lockSlotWithReason(dateText,slotKey,reason){
      Swal.close();
      setTimeout(function(){
        updateSlotState(dateText, slotKey, "lock", reason || "");
      }, 80);
    }

    function askCustomBlockReason(dateText,slotKey){
      Swal.fire({
        icon:"question",
        title:"\u8f38\u5165\u5c01\u9396\u539f\u56e0",
        input:"text",
        inputPlaceholder:"\u4f8b\uff1a\u79c1\u4eba\u884c\u7a0b / \u81e8\u6642\u4fdd\u7559",
        showCancelButton:true,
        confirmButtonText:"\u5c01\u9396\u6642\u6bb5",
        cancelButtonText:"\u53d6\u6d88",
        confirmButtonColor:"#dc2626"
      }).then(function(customResult){
        if(customResult && customResult.isConfirmed){
          updateSlotState(dateText, slotKey, "lock", customResult.value || "\u5176\u4ed6");
        }
      });
    }

    function updateSlotState(dateText,slotKey,action,reason){
      var mutationKey =
        "slot:" + dateText + ":" + slotKey;

      if(!beginAdminMutation(mutationKey)){
        return;
      }

      showInlineActionLoading(
        action === "unlock" ?
        "\u958b\u555f\u6642\u6bb5\u4e2d..." :
        "\u5c01\u9396\u6642\u6bb5\u4e2d..."
      );
      google.script.run
        .withSuccessHandler(function(result){
          endAdminMutation(mutationKey);
          closeInlineActionLoading();
          var status = result && result.status ? result.status : "";
          if(status === "BOOKED"){
            Swal.fire("\u7121\u6cd5\u5c01\u9396","\u9019\u500b\u6642\u6bb5\u5df2\u6709\u9810\u7d04\u3002","warning");
            syncDataAfterFastUiUpdate(dateText);
            return;
          }
          if(status !== "LOCK" && status !== "UNLOCK"){
            Swal.fire("\u66f4\u65b0\u672a\u5b8c\u6210","\u5f8c\u53f0\u56de\u50b3\u72c0\u614b\u7570\u5e38\uff0c\u8acb\u91cd\u65b0\u8f09\u5165\u5f8c\u518d\u8a66\u3002","warning");
            reloadDataAfterMutation(dateText);
            return;
          }
          applySlotStateLocally(
            result.dateText || dateText,
            result.slotKey || slotKey,
            result.slotStatus || (status === "LOCK" ? "blocked" : "open"),
            result.reason || reason || ""
          );
          Swal.fire({
            toast:true,
            position:"top",
            icon:"success",
            title:"\u6642\u6bb5\u72c0\u614b\u5df2\u66f4\u65b0",
            showConfirmButton:false,
            timer:1400
          });
          syncDataAfterFastUiUpdate(result.dateText || dateText);
        })
        .withFailureHandler(function(err){
          endAdminMutation(mutationKey);
          closeInlineActionLoading();
          Swal.fire("\u66f4\u65b0\u5931\u6557", err && err.message ? err.message : "\u8acb\u7a0d\u5f8c\u518d\u8a66", "error");
        })
        .updateAdminAppSlotState(dateText, slotKey, action, reason);
    }

    function lockCurrentMonthEveningSlots(){
      var start = getMonthStart(currentMonthOffset);
      var titleText =
        start.getFullYear() + " / " + (start.getMonth() + 1);

      Swal.fire({
        icon:"question",
        title:"\u95dc\u9589\u672c\u6708\u665a\u4e0a\u6642\u6bb5\uff1f",
        text:titleText + " \u6240\u6709\u672a\u9810\u7d04\u7684\u665a\u4e0a\u6642\u6bb5\u6703\u88ab\u5c01\u9396\uff0c\u5df2\u6709\u9810\u7d04\u7684\u665a\u4e0a\u6703\u81ea\u52d5\u8df3\u904e\u3002",
        showCancelButton:true,
        confirmButtonText:"\u78ba\u8a8d\u95dc\u9589\u665a\u4e0a",
        cancelButtonText:"\u53d6\u6d88",
        confirmButtonColor:"#f97316"
      }).then(function(result){
        if(!result || !result.isConfirmed){
          return;
        }

        setLoading(true);
        google.script.run
          .withSuccessHandler(function(response){
            setLoading(false);
            if(!response || response.status !== "OK"){
              Swal.fire("\u95dc\u9589\u5931\u6557","\u5f8c\u53f0\u56de\u50b3\u7570\u5e38\uff0c\u8acb\u91cd\u65b0\u8f09\u5165\u5f8c\u518d\u8a66\u3002","error");
              return;
            }

            clearAdminAppLocalCache();
            Swal.fire({
              icon:"success",
              title:"\u665a\u4e0a\u6642\u6bb5\u5df2\u6279\u6b21\u95dc\u9589",
              html:
                "\u65b0\u589e\u5c01\u9396\uff1a" + Number(response.changed || 0) + " \u5929<br>" +
                "\u5df2\u6709\u9810\u7d04\u8df3\u904e\uff1a" + Number(response.skippedBooked || 0) + " \u5929<br>" +
                "\u539f\u672c\u5df2\u5c01\u9396\uff1a" + Number(response.skippedLocked || 0) + " \u5929",
              confirmButtonColor:"#16a34a"
            }).then(function(){
              loadData(currentMonthOffset, { force:true });
            });
          })
          .withFailureHandler(function(error){
            setLoading(false);
            Swal.fire(
              "\u95dc\u9589\u5931\u6557",
              error && error.message ? error.message : "\u8acb\u7a0d\u5f8c\u518d\u8a66",
              "error"
            );
          })
          .lockAdminAppMonthEveningSlots(
            currentMonthOffset,
            "\u665a\u4e0a\u95dc\u9589"
          );
      });
    }

    function getSlotLabel(slotKey){
      if(slotKey === "morning"){ return "\u4e0a\u5348"; }
      if(slotKey === "afternoon"){ return "\u4e0b\u5348"; }
      if(slotKey === "evening"){ return "\u665a\u4e0a"; }
      return "";
    }

    function escapeHtml(value){
      return String(value == null ? "" : value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#39;");
    }

    function escapeAttr(value){
      return escapeHtml(value);
    }

    function escapeJs(value){
      return String(value == null ? "" : value)
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'")
        .replace(/"/g,'\\"')
        .replace(/\r/g,"\\r")
        .replace(/\n/g,"\\n")
        .replace(/</g,"\\u003C")
        .replace(/>/g,"\\u003E");
    }

    function encodeEventArg(value){
      return encodeURIComponent(String(value == null ? "" : value));
    }

    function decodeEventArg(value){
      try{
        return decodeURIComponent(String(value || ""));
      }catch(error){
        return String(value || "");
      }
    }
  </script>
